[build]
  publish = "dist"

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Form submissions will be forwarded to hello@si-lounge.com
# To finish setup: go to Netlify Dashboard → Forms → contact → Notifications → Add notification → Email → hello@si-lounge.com
# Or set it up via CLI: netlify forms:notify --form contact --email hello@si-lounge.com
